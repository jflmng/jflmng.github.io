{% assign p = include.person %}
<div class="person-card">
  <img class="person-card__photo" src="{{ p.photo | default: '/assets/images/people/placeholder.svg' | relative_url }}" alt="{{ p.name }}">
  <h3 class="person-card__name">{% if p.url %}<a href="{{ p.url | relative_url }}">{{ p.name }}</a>{% else %}{{ p.name }}{% endif %}</h3>
  <p class="person-card__role">{{ p.role }}</p>
  {% if p.topic %}<p class="person-card__topic">{{ p.topic }}</p>{% endif %}
  <p class="person-card__links">
    {% if p.email %}<a href="mailto:{{ p.email }}" aria-label="Email"><i class="fas fa-envelope"></i></a>{% endif %}
    {% if p.scholar %}<a href="{{ p.scholar }}" aria-label="Google Scholar"><i class="fas fa-graduation-cap"></i></a>{% endif %}
    {% if p.linkedin %}<a href="{{ p.linkedin }}" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>{% endif %}
    {% if p.github %}<a href="{{ p.github }}" aria-label="GitHub"><i class="fab fa-github"></i></a>{% endif %}
  </p>
</div>
